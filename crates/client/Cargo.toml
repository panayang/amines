[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
leptos = { version = "0.7", features = ["csr"] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-storage = "0.3"
uuid = { version = "1.8", features = ["v4", "js"] }
rand = { version = "0.8", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlElement",
    "HtmlInputElement",
    "Window",
    "Document",
    "Storage",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Navigator",
    "Clipboard",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
console_error_panic_hook = "0.1"
tracing = "0.1"
tracing-wasm = "0.2"
