[package]
name = "amine-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
server = { path = "../server" }
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["connect"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
url = "2.5"
