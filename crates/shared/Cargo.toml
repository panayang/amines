[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.8", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
