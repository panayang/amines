[package]
name = "amine-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
server = { path = "../server" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["connect"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
chrono = "0.4"
url = "2.5"
